<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background: rgb(79, 116, 239);
        }

        .container {
            width: 100%;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* CLOUDS */
        .cloud_1 {
            position: absolute;
            top: 200px;
            left: 500px;
            transform: scale(0.6);
            animation: MovingCloud_1 35s linear infinite;
        }

        .cloud_rectangle {
            background: white;
            width: 350px;
            height: 150px;
            border-radius: 100px;
        }

        .cloud_left {
            background: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            top: -40px;
            left: 60px;
        }

        .cloud_right {
            background: white;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: absolute;
            top: -60px;
            left: 140px;
        }

        .cloud_2 {
            position: absolute;
            top: 400px;
            left: 100px;
            transform: scale(0.4);
            animation: MovingCloud_2 35s linear infinite;
        }

        .cloud_3 {
            position: absolute;
            top: 50px;
            left: 100px;
            transform: scale(0.7);
            animation: MovingCloud_3 35s linear infinite;
        }

        .cloud_4 {
            position: absolute;
            top: 100px;
            left: 850px;
            transform: scale(0.6);
            animation: MovingCloud_1 35s linear infinite;
        }

        .cloud_5 {
            position: absolute;
            top: 300px;
            left: 1200px;
            transform: scale(0.4);
            animation: MovingCloud_2 35s linear infinite;
        }

        /* animation */
        @keyframes MovingCloud_1 {
            0% {
                transform: scale(0.6);
                margin-left: -1000px;
            }

            100% {
                transform: scale(0.6);
                margin-left: 100%;
            }
        }

        @keyframes MovingCloud_2 {
            0% {
                transform: scale(0.4);
                margin-left: -1000px;
            }

            100% {
                transform: scale(0.4);
                margin-left: 100%;
            }
        }

        @keyframes MovingCloud_3 {
            0% {
                transform: scale(0.7);
                margin-left: -1000px;
            }

            100% {
                transform: scale(0.7);
                margin-left: 100%;
            }
        }

        .bird {
            margin-top: 300px;
            position: absolute;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: FlyAcross 12s linear infinite;
        }

        @keyframes FlyAcross {
            0% {
                right: 300px;
                transform: translateY(0) scale(1.5);
            }

            50% {
                transform: translateY(-30px) scale(1.5);
            }

            100% {
                right: 100%;
                transform: translateY(0) scale(1.5);
            }
        }

        .body {
            margin: 0 50px;
            position: absolute;
            top: 0px;
            left: 0px;
            transform: rotate(5deg);
        }

        .body-1 {
            border-bottom: 190px solid rgb(188, 236, 115);
            border-left: 90px solid transparent;
            border-right: 80px solid transparent;
            height: 0;
            width: 50px;
            border-radius: 50% 50% 50% 50% / 100% 100% 0% 0%;
            transform: rotate(-130deg) skewY(-20deg);
            position: absolute;
            top: 150px;
            left: 150px;
        }

        .body-2 {
            border-bottom: 160px solid rgb(194, 235, 131);
            border-left: 70px solid transparent;
            border-right: 80px solid transparent;
            height: 0;
            width: 50px;
            border-radius: 50% 50% 50% 50% / 100% 100% 0% 0%;
            transform: rotate(-185deg) skewY(20deg);
            position: absolute;
            top: 140px;
            left: 78px;
        }

        .body-3 {
            width: 160px;
            height: 100px;
            background: rgb(188, 236, 115);
            position: absolute;
            top: 73px;
            left: 70px;
            transform: rotate(29deg);
            border-radius: 43% 57% 83% 17% / 63% 20% 80% 37%;
        }

        .beak {
            position: absolute;
            top: 130px;
            left: -59px;
        }

        .beak_upper {
            transform: rotate(-28deg) scale(0.25);
            position: relative;
            top: 0px;
            left: 0px;
            z-index: 1;

        }

        .triangle-up {
            width: 0;
            height: 0;
            border-left: 260px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 35px solid rgb(193, 84, 29);
            border-radius: 120% 0% 0% 0%;
            position: relative;
            animation: MoveUpDown 1s ease-out infinite alternate;
            transform-origin: bottom right;
        }

        .triangle-up2 {
            padding: 0;
            width: 260px;
            height: 35px;
            background-color: rgb(193, 84, 29);
            transform: rotate(0deg);
            border-radius: 100% 0% 0% 100% / 100% 0% 0% 0%;
            position: absolute;
            top: 0px;
            left: -260px;
        }

        .triangle-down {
            width: 0;
            height: 0;
            border-left: 225px solid transparent;
            border-right: 60px solid transparent;
            border-top: 60px solid rgb(193, 84, 29);
            position: absolute;
            top: 35px;
            left: 0px;
        }

        @keyframes MoveUpDown {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(3deg);
            }
        }


        /* EYE */
        .eye {
            transform: scale(0.25);
            position: absolute;
            top: 110px;
            left: 140px;
        }

        .outer {
            height: 80px;
            width: 80px;
            background: brown;
            border-radius: 50%;
            position: absolute;
        }

        .inner {
            height: 40px;
            width: 40px;
            background: black;
            border-radius: 50%;
            position: absolute;
            left: 16%;
            top: 25%;
        }


        /* Wing */
        .wing {
            position: absolute;
            top: 110px;
            left: 245px;
            transform: scale(1.3);
            transform-origin: middle left;
            animation: Fly2 1s infinite alternate;
        }

        .wing_big {
            width: 215px;
            height: 115px;
            background-color: green;
            border-radius: 33% 67% 57% 43% / 50% 0% 100% 50%;
            position: absolute;
        }

        .wing-1 {
            width: 50px;
            height: 30px;
            background-color: green;
            border-radius: 50%;
            transform: rotate(-5deg);
            position: absolute;
            top: 89px;
            left: 92px;
        }

        .wing-2 {
            width: 45px;
            height: 30px;
            background-color: green;
            border-radius: 50%;
            transform: rotate(-10deg);
            position: absolute;
            top: 82px;
            left: 130px;
        }

        .wing-3 {
            width: 45px;
            height: 30px;
            background-color: green;
            border-radius: 50%;
            transform: rotate(-30deg);
            position: absolute;
            top: 68px;
            left: 170px;

        }

        .wing-4 {
            transform: rotate(16deg);
            width: 60px;
            height: 30px;
            background-color: green;
            border-radius: 0% 100% 58% 42% / 99% 0% 100% 1%;
            position: absolute;
            top: 55px;
            left: 185px;
        }

        .wing-5 {
            transform: rotate(11deg) scale(1.1);
            width: 70px;
            height: 30px;
            background-color: green;
            border-radius: 0% 100% 58% 42% / 99% 0% 100% 1%;
            position: absolute;
            top: 29px;
            left: 198px;
        }

        .wing-6 {
            transform: rotate(-1deg) scale(1.2);
            width: 75px;
            height: 30px;
            background-color: green;
            border-radius: 0% 100% 58% 42% / 99% 0% 100% 1%;
            position: absolute;
            top: 2px;
            left: 207px;
        }

        /* Second wing */
        .secondwing {
            position: absolute;
            top: 140px;
            left: 200px;
            transform: scale(1.2) rotate(-35deg);
            z-index: -1;
            transform-origin: top left;
            animation: Fly 1s infinite alternate;
        }

        /* Wings animation */
        @keyframes Fly {
            0% {
                transform: scale(1.2) rotate(-50deg);
            }

            50% {}

            100% {
                transform: scale(1.2) rotate(10deg);
            }
        }

        @keyframes Fly2 {
            0% {
                transform: scale(1.3) rotate(-5deg);
            }

            50% {}

            100% {
                transform: scale(1.3) rotate(38deg);
            }
        }

        /* Tail */
        .tail {
            position: absolute;
            top: 88px;
            left: 430px;
            transform: scale(1.3) rotate(50deg);
            z-index: -1;
        }

        .tail_feather {
            position: absolute;
            top: 100px;
            left: 100px;
            background-color: rgb(10, 216, 20);
            width: 140px;
            height: 18px;
            border-radius: 0% 100% 23% 77% / 60% 0% 100% 40%;

        }

        .tail-green {
            position: absolute;
            top: -14px;
            left: 0px;
            z-index: -1;
            transform: rotate(-8deg);
            background-color: rgb(11, 150, 11);
            width: 148px;
            height: 18px;
            border-radius: 0% 100% 23% 77% / 60% 0% 100% 40%;
        }

        .tail-darkgreen {
            position: absolute;
            top: -25px;
            left: 0px;
            z-index: -2;
            transform: rotate(-13deg);
            background-color: rgb(3, 80, 3);
            width: 152px;
            height: 18px;
            border-radius: 0% 100% 23% 77% / 60% 0% 100% 40%;
        }

        .tail-darkergreen {
            position: absolute;
            top: -37px;
            left: 0px;
            z-index: -3;
            transform: rotate(-18deg);
            background-color: #032703;
            width: 150px;
            height: 18px;
            border-radius: 0% 100% 23% 77% / 60% 0% 100% 40%;
        }


        /* --------------------- mela ----------------------*/

        .wheel {
            width: 400px;
            height: 400px;
            border: 2px dashed white;
            border-radius: 50%;
            position: relative;
        }

        .center {
            width: 40px;
            height: 40px;
            background: orange;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: rotateOrbit 10s linear infinite;
        }

        .cabin {
            width: 50px;
            height: 50px;
            background: orange;
            border-radius: 10px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .orbit {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: rotateOrbit 10s linear infinite;
        }

        .one {
            animation-delay: 0s;
        }

        .two {
            animation-delay: -2s;
        }

        .three {
            animation-delay: -4s;
        }

        .four {
            animation-delay: -6s;
        }

        .five {
            animation-delay: -8s;
        }

        .line {
            position: absolute;
            width: 2px;
            height: 50%;
            background: white;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .stand {
            width: 10px;
            height: 300px;
            background: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 0);
            z-index: 1;
        }

        @keyframes rotateOrbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        /* ****************** ballon ******************/

        .bunch {
            position: relative;
            width: 200px;
            height: 300px;
        }

        .string {
            width: 2px;
            height: 180px;
            background: white;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .balloon {
            width: 50px;
            height: 65px;
            border-radius: 50%;
            position: absolute;
            bottom: 160px;
            animation: float 3s ease-in-out infinite;
        }

        .balloon::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 40px;
            background: white;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
        }

        .red {
            background: red;
            left: 50%;
            transform: translateX(-50%);
        }

        .yellow {
            background: yellow;
            left: 30%;
            bottom: 150px;
        }

        .green {
            background: green;
            left: 70%;
            bottom: 150px;
        }

        .blue {
            background: blue;
            left: 20%;
            bottom: 120px;
        }

        .pink {
            background: pink;
            left: 80%;
            bottom: 120px;
        }


        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .fair {
            margin-top: 800px;
            display: flex;
            flex-direction: row;
        }
    </style>
</head>

<body>

    <!-- bird -->
    <div class="container">
        <div class="cloud_1">
            <div class="cloud_rectangle">
                <div class="cloud_left"></div>
                <div class="cloud_right"></div>
            </div>
        </div>
        <div class="cloud_2">
            <div class="cloud_rectangle">
                <div class="cloud_left"></div>
                <div class="cloud_right"></div>
            </div>
        </div>
        <div class="cloud_3">
            <div class="cloud_rectangle">
                <div class="cloud_left"></div>
                <div class="cloud_right"></div>
            </div>
        </div>
        <div class="cloud_4">
            <div class="cloud_rectangle">
                <div class="cloud_left"></div>
                <div class="cloud_right"></div>
            </div>
        </div>
        <div class="cloud_5">
            <div class="cloud_rectangle">
                <div class="cloud_left"></div>
                <div class="cloud_right"></div>
            </div>
        </div>
        <div class="bird">
            <div class="body">
                <div class="body-1"></div>
                <div class="body-2"></div>
                <div class="body-3"></div>
            </div>

            <!-- beak -->
            <div class="beak">
                <div class="beak_upper">
                    <div class="triangle-up">
                        <div class="triangle-up2"></div>
                    </div>
                    <div class="triangle-down"></div>
                </div>
            </div>
            <div class="eye">
                <div class="outer">
                    <div class="inner"></div>
                </div>
            </div>

            <!-- wing -->
            <div class="wing">
                <div class="wing_big">
                    <div class="wing-1"></div>
                    <div class="wing-2"></div>
                    <div class="wing-3"></div>
                    <div class="wing-4"></div>
                    <div class="wing-5"></div>
                    <div class="wing-6"></div>
                </div>
            </div>
            <div class="secondwing">
                <div class="wing_big">
                    <div class="wing-1"></div>
                    <div class="wing-2"></div>
                    <div class="wing-3"></div>
                    <div class="wing-4"></div>
                    <div class="wing-5"></div>
                    <div class="wing-6"></div>
                </div>
            </div>

            <!-- tail -->
            <div class="tail">
                <div class="tail_feather">
                    <div class="tail-green"></div>
                    <div class="tail-darkgreen"></div>
                    <div class="tail-darkergreen"></div>
                </div>
            </div>
        </div>


    </div>

    <div class="fair">

        <!--  mela-->
        <div class="wheel">
            <div class="stand"></div>
            <div class="center"></div>

            <div class="orbit one">
                <div class="line"></div>
                <div class="cabin"></div>
            </div>

            <div class="orbit two">
                <div class="line"></div>
                <div class="cabin"></div>
            </div>

            <div class="orbit three">
                <div class="line"></div>
                <div class="cabin"></div>
            </div>

            <div class="orbit four">
                <div class="line"></div>
                <div class="cabin"></div>
            </div>

            <div class="orbit five">
                <div class="line"></div>
                <div class="cabin"></div>
            </div>
        </div>


        <!-- ballon -->
        <!-- <div class="bunch">
            <div class="string"></div>
            <div class="balloon red"></div>
            <div class="balloon yellow"></div>
            <div class="balloon green"></div>
            <div class="balloon blue"></div>
            <div class="balloon pink"></div>
        </div> -->

    </div>



</body>

</html>
